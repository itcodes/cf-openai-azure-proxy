name = "azure-ai"
main = "cf-openai-azure-proxy.js"
compatibility_date = "2025-01-01"

# Enable logs in Cloudflare dashboard (Workers -> your worker -> Logs)
[observability]
enabled = true

# Non-secret variables (visible in dashboard, committed to git).
# Note: `wrangler deploy` replaces plain-text vars set in the dashboard with
# what is listed here, so keep plain vars in this file. Secrets are untouched.
[vars]
# MODEL_LIST            = "gpt-5.5,gpt-5.4,grok-4-20,deepseek-r1"   # what GET /v1/models shows
# ALLOWED_ORIGINS       = "https://chat.example.com"
# UPSTREAM_TIMEOUT_MS   = "120000"

# Secrets — set via CLI, never commit them:
#
#   wrangler secret put AZURE_ENDPOINTS      # url or url|key, comma-separated, e.g.
#                                            # https://a.openai.azure.com|key1,https://b.services.ai.azure.com|key2
#   wrangler secret put AZURE_API_KEY        # Default key for entries without one
#   wrangler secret put CLIENT_API_KEYS      # sk-xxx,sk-yyy  (comma-separated client allowlist)
#   wrangler secret put MODEL_MAPPING        # Optional — model aliases (JSON string)
#
# Model names are sent to Azure as deployment names, so MODEL_MAPPING is only
# needed when the name a client uses differs from the deployment name. Example
# (paste as a single line when running the command):
# {
#   "gpt-chat-latest": "gpt-5.5",
#   "my-grok":         {"deployment":"grok-4-20", "backend":"infer"}
# }

# ------------------------------------------------------------
# Deploy steps:
#   npm i -g wrangler
#   wrangler login
#   wrangler secret put AZURE_API_KEY
#   wrangler secret put CLIENT_API_KEYS
#   wrangler deploy
#
# After deploy, your worker URL is printed. Use {URL}/v1 as the OpenAI
# base URL in your client software, and a CLIENT_API_KEYS entry as the key.
# ------------------------------------------------------------

# Optional: bind a custom domain. Replace and uncomment:
# [[routes]]
# pattern = "api.yourdomain.com/*"
# custom_domain = true
